#cloud-config
users:
  - name: ${instance_user}
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh-authorized-keys:
      - ${ssh_public_key}

package_update: true
package_upgrade: false
packages:
  - nginx

runcmd:
  - systemctl enable nginx
  - systemctl restart nginx
